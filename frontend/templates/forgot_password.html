<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS Generator — Lupa Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #06101f; --surface: rgba(13, 31, 67, .9); --border: rgba(130, 179, 255, .22); --text: #f4f8ff; --muted: #b7c8e8; --blue: #38a4ff; --purple: #8d8cff; }
        body { min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--text); background: linear-gradient(120deg, rgba(6,16,31,.95), rgba(10,23,48,.92)); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px 32px; backdrop-filter: blur(16px); box-shadow: 0 24px 60px rgba(0,0,0,.3); text-align: center; }
        .auth-card .logo { width: 48px; height: 48px; background: linear-gradient(135deg, var(--blue), var(--purple)); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #fff; margin-bottom: 16px; }
        .auth-card h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; }
        .auth-card p { color: var(--muted); font-size: .88rem; margin-bottom: 24px; line-height: 1.6; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: .78rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: .9rem; font-family: inherit; outline: none; }
        .form-group input:focus { border-color: var(--blue); }
        .btn-submit { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--blue), #4e6dff); color: #fff; border: none; border-radius: 10px; font-size: .92rem; font-weight: 800; cursor: pointer; transition: transform .15s; }
        .btn-submit:hover { transform: translateY(-1px); }
        .auth-link { text-align: center; margin-top: 16px; font-size: .82rem; color: var(--muted); }
        .auth-link a { color: var(--blue); text-decoration: none; font-weight: 600; }
        .flash-msg { background: rgba(5,205,153,.15); border: 1px solid rgba(5,205,153,.3); color: #05cd99; padding: 10px 14px; border-radius: 10px; font-size: .82rem; margin-bottom: 16px; }
        .flash-msg.error { background: rgba(255,59,48,.15); border-color: rgba(255,59,48,.3); color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo"><i class="fas fa-chart-simple"></i></div>
        <h1>Lupa Password</h1>
        <p>Masukkan email Anda. Jika email terdaftar, tautan reset password akan dikirim.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="flash-msg {% if category == 'error' %}error{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Masukkan email Anda" required>
            </div>
            <button type="submit" class="btn-submit">Kirim Tautan Reset</button>
        </form>
        <div class="auth-link"><a href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-left"></i> Kembali ke Login</a></div>
    </div>
</body>
</html>
