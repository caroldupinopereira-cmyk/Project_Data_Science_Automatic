<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS Generator — Selamat Datang!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #06101f; --surface: rgba(13, 31, 67, .9); --border: rgba(130, 179, 255, .22); --text: #f4f8ff; --muted: #b7c8e8; --blue: #38a4ff; --purple: #8d8cff; --green: #05cd99; }
        body { min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--text); background: linear-gradient(120deg, rgba(6,16,31,.95), rgba(10,23,48,.92)); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .onboard-card { width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 48px 36px; backdrop-filter: blur(16px); box-shadow: 0 24px 60px rgba(0,0,0,.3); text-align: center; }
        .onboard-card .logo { width: 56px; height: 56px; background: linear-gradient(135deg, var(--blue), var(--purple)); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #fff; margin-bottom: 20px; }
        .onboard-card h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
        .onboard-card .welcome { color: var(--green); font-size: .95rem; margin-bottom: 24px; }
        .steps { text-align: left; margin: 24px 0; }
        .step { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 20px; }
        .step-num { width: 32px; height: 32px; background: linear-gradient(135deg, var(--blue), var(--purple)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .82rem; font-weight: 800; color: #fff; flex-shrink: 0; }
        .step-text h3 { font-size: .92rem; font-weight: 700; margin-bottom: 4px; }
        .step-text p { font-size: .82rem; color: var(--muted); line-height: 1.5; }
        .btn-start { display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px; background: linear-gradient(135deg, var(--blue), #4e6dff); color: #fff; border: none; border-radius: 12px; font-size: .95rem; font-weight: 800; cursor: pointer; transition: transform .15s, box-shadow .2s; margin-top: 16px; }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(56, 164, 255, .3); }
    </style>
</head>
<body>
    <div class="onboard-card">
        <div class="logo"><i class="fas fa-chart-simple"></i></div>
        <h1>Selamat Datang!</h1>
        <p class="welcome">Halo, {{ username }}! 👋</p>

        <div class="steps">
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-text">
                    <h3>Upload Dataset</h3>
                    <p>Unggah file CSV, Excel, atau TXT untuk memulai analisis.</p>
                </div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-text">
                    <h3>Auto-EDA</h3>
                    <p>Sistem akan otomatis mendeteksi tipe data dan menghitung statistik.</p>
                </div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-text">
                    <h3>Visualize & Export</h3>
                    <p>Buat visualisasi interaktif dan ekspor laporan dalam berbagai format.</p>
                </div>
            </div>
        </div>

        <button class="btn-start" onclick="completeOnboarding()">
            Mulai Analisis <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <script>
        function completeOnboarding() {
            fetch('/auth/complete-onboarding', { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.redirect) window.location.href = data.redirect;
                    else window.location.href = '/upload';
                })
                .catch(function() { window.location.href = '/upload'; });
        }
    </script>
</body>
</html>
